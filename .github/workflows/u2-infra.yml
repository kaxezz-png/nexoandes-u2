# Pipeline de infraestructura U2 (AWS + Azure).
# controles -> plan -> autorizacion (environment con revisor) -> apply -> verificacion
#
# Se ejecuta en un RUNNER AUTOALOJADO (el PC del alumno, Windows + Git Bash):
# el tenant Azure del instituto no permite crear service principals, asi que
# el pipeline usa la sesion `az login` del alumno y el perfil AWS local del
# Learner Lab. No hay credenciales de nube guardadas en GitHub.
# Solo se dispara a mano (workflow_dispatch): nadie sin permiso de escritura
# puede ejecutarlo en el runner.

name: u2-infra

on:
  workflow_dispatch:
    inputs:
      operacion:
        description: "plan = solo revisar | apply = desplegar/actualizar | destroy = limpieza final"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read

concurrency:
  group: u2-infra # un solo pipeline a la vez sobre el mismo state
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  controles:
    name: 1. Controles
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4
      - name: Versiones y contexto
        run: |
          terraform version
          aws --version
          az version --query '"azure-cli"' -o tsv
          echo "AWS: $(aws sts get-caller-identity --query Arn --output text | sed 's/[0-9]\{12\}/************/')"
          echo "Azure: $(az account show --query name -o tsv)"
      - name: Formato
        run: terraform fmt -check -recursive
      - name: Validacion
        run: |
          terraform init -backend=false
          terraform validate
      - name: Sin secretos ni state en el repositorio
        run: |
          if git ls-files | grep -E '\.tfstate|\.tfplan|\.pem$|\.key$|(^|/)\.env$'; then
            echo "ERROR: hay archivos prohibidos versionados"; exit 1
          fi
      - name: Plantilla con saltos de linea LF
        run: |
          if grep -q $'\r' templates/user_data_u2.sh.tpl; then
            echo "ERROR: la plantilla tiene CRLF"; exit 1
          fi

  plan:
    name: 2. Plan
    needs: controles
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4
      - name: Init con backend remoto
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=nexoandes-u2/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"
      - name: Plan
        run: |
          export TF_VAR_build_ref="${GITHUB_SHA::12}"
          export TF_VAR_azure_admin_ssh_public_key="$(cat ~/.ssh/nexoandes_u2.pub)"
          MODO=""
          [ "${{ inputs.operacion }}" = "destroy" ] && MODO="-destroy"
          terraform plan $MODO -out=tfplan -no-color | tee plan.txt
          {
            echo "## Plan (${{ inputs.operacion }}) - commit ${GITHUB_SHA::12}"
            echo "Hora UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            tfplan
            plan.txt
          retention-days: 1

  apply:
    name: 3. Autorizacion y apply
    if: inputs.operacion != 'plan'
    needs: plan
    runs-on: [self-hosted, Windows]
    # El environment "u2-aprobacion" tiene "Required reviewers".
    # El job queda detenido hasta que se apruebe el plan revisado.
    environment: u2-aprobacion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
      - name: Init con backend remoto
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=nexoandes-u2/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"
      - name: Apply del plan autorizado
        run: |
          echo "Inicio apply (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$GITHUB_STEP_SUMMARY"
          terraform apply -no-color tfplan
          echo "Fin apply (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Outputs
        if: inputs.operacion == 'apply'
        run: |
          terraform output -no-color | tee outputs.txt
          { echo '## Outputs'; echo '```'; cat outputs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  verificacion:
    name: 4. Verificacion independiente
    if: inputs.operacion == 'apply'
    needs: apply
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4
      - name: Leer outputs del state
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=nexoandes-u2/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true" > /dev/null
          for o in aws_endpoint aws_asg_name aws_target_group_arn aws_launch_template_version aws_app_version azure_endpoint azure_resource_group azure_vm_name; do
            echo "$o=$(terraform output -raw $o)" >> "$GITHUB_ENV"
          done
      - name: AWS - esperar al controlador y comprobar version, capacidad y destinos
        run: bash scripts/esperar_refresh.sh "$aws_asg_name" "$aws_target_group_arn" "$aws_endpoint" "$aws_app_version" "$aws_launch_template_version"
      - name: AWS - consulta independiente de instancias por tag
        run: |
          aws ec2 describe-instances \
            --filters "Name=tag:alumno,Values=a007" "Name=instance-state-name,Values=pending,running" \
            --query 'Reservations[].Instances[].[InstanceId,Placement.AvailabilityZone,PrivateIpAddress,Tags[?Key==`portal_version`]|[0].Value,Tags[?Key==`build_ref`]|[0].Value,LaunchTime]' \
            --output table
      - name: Azure - consulta independiente y prueba HTTP
        run: |
          az vm show -d -g "$azure_resource_group" -n "$azure_vm_name" \
            --query '{nombre:name,vmId:vmId,ubicacion:location,estado:powerState,ipPrivada:privateIps,ipPublica:publicIps,tags:tags}' -o json
          code=000
          for i in $(seq 1 30); do
            code=$(curl -sS --max-time 5 -o azure.json -w '%{http_code}' "$azure_endpoint/api/check" || echo 000)
            [ "$code" = "200" ] && break
            echo "Azure aun no responde 200 (HTTP $code), espera $i/30"; sleep 10
          done
          cat azure.json; echo
          [ "$code" = "200" ] && grep -q '"version": "v1"' azure.json
